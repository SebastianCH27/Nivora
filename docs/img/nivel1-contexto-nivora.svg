   </g>
   <g id="text_21">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1008.824375 903.318281)">Entrega avisos a los dispositivos</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1024.893828 918.363445)">asociados, según permiso,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1013.673828 932.770609)">conectividad y compatibilidad.</text>
   </g>
