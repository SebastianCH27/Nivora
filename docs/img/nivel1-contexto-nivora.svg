    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #197b83" x="64.8" y="45.118125" transform="rotate(-0 64.8 45.118125)">NIVORA · MODELO C4</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18344a" x="64.8" y="83.875781" transform="rotate(-0 64.8 83.875781)">Nivel 1 · Contexto del sistema</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536a7b" x="64.8" y="112.2825" transform="rotate(-0 64.8 112.2825)">Personas, sistema en alcance y servicios externos · Diseño del sistema objetivo</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="208.8" y="276.357656" transform="rotate(-0 208.8 276.357656)">Usuario de consulta</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d6e2ea" x="208.8" y="297.038438" transform="rotate(-0 208.8 297.038438)">[Persona]</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #f1f5f8" transform="translate(116.448984 322.998281)">Consulta consumo, estimaciones,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #f1f5f8" transform="translate(137.672109 337.405445)">historial, recibos y avisos.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #f1f5f8" transform="translate(98.341094 351.812609)">Habilita notificaciones en su dispositivo.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="208.8" y="827.157656" transform="rotate(-0 208.8 827.157656)">Administrador</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d6e2ea" x="208.8" y="847.838438" transform="rotate(-0 208.8 847.838438)">[Persona]</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #f1f5f8" transform="translate(109.003359 873.798281)">Gestiona configuraciones y consulta</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #f1f5f8" transform="translate(124.931875 888.205445)">registros de acceso. Supervisa</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #f1f5f8" transform="translate(120.895391 903.250609)">la integración y sus incidencias.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="648" y="510.517031" transform="rotate(-0 648 510.517031)">Nivora</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d6e7f5" x="648" y="533.918437" transform="rotate(-0 648 533.918437)">[Sistema de software en alcance]</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f0f6fb" transform="translate(553.382812 563.518125)">Monitorea el consumo de agua.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f0f6fb" transform="translate(552.383438 579.235031)">Presenta estimaciones, historial</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f0f6fb" transform="translate(545.226562 594.951937)">y recibos; genera alertas y avisos.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18344a" transform="translate(1007.946094 222.317812)">Sistema de la empresa</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18344a" transform="translate(1066.363281 240.654203)">de agua</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #536a7b" x="1098" y="262.478438" transform="rotate(-0 1098 262.478438)">[Sistema externo]</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1004.804219 291.318281)">Proporciona suministros, lecturas,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1052.217656 305.725445)">tarifas y recibos.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(998.012578 320.132609)">Representado por una API simulada.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18344a" transform="translate(1011.642969 524.717812)">Servicio de validación</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18344a" transform="translate(1069.131562 543.054203)">del DNI</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #536a7b" x="1098" y="564.878438" transform="rotate(-0 1098 564.878438)">[Sistema externo]</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1020.810938 593.718281)">Consulta el DNI y sus datos.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1029.650469 608.125445)">Actual: identidad ficticia.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #536a7b" transform="translate(1022.778047 623.170609)">RENIEC: integración futura.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18344a" transform="translate(1054.242344 834.317812)">Servicio de</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #18344a" transform="translate(1042.888125 852.654203)">notificaciones</text>
   </g>
   <g id="text_20">
