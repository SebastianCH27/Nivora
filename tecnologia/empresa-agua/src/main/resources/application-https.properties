# Perfil para el proveedor simulado en el despliegue HTTPS de pruebas.
server.address=${EMPRESA_HTTPS_DIRECCION:127.0.0.1}
server.port=${EMPRESA_HTTPS_PUERTO:8444}
server.ssl.enabled=true
server.ssl.key-store=${EMPRESA_TLS_KEYSTORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${EMPRESA_TLS_CLAVE}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
