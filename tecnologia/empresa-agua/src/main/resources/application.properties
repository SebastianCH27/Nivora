spring.application.name=empresa-agua

server.address=127.0.0.1
server.port=8081

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/empresa_agua?connectionTimeZone=UTC&rewriteBatchedStatements=true
spring.datasource.username=empresa_app
spring.datasource.password=${EMPRESA_DB_CLAVE}

spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

empresa.carga-inicial.habilitada=false
empresa.carga-inicial.cantidad=100000

empresa.lecturas.habilitada=false

empresa.carga-mensual.habilitada=false

empresa.consumo-continuo.habilitado=true
empresa.consumo-continuo.espera-inicial-ms=2000
empresa.consumo-continuo.intervalo-ms=2000

empresa.carga-tarifas.habilitada=false

empresa.carga-recibos.habilitada=false

spring.task.scheduling.pool.size=2

empresa.emision-recibos.habilitada=true
empresa.emision-recibos.espera-inicial-ms=10000
empresa.emision-recibos.intervalo-ms=60000