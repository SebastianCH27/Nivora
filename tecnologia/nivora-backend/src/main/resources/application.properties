spring.application.name=nivora-backend

server.address=127.0.0.1
server.port=8082

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/nivora?connectionTimeZone=UTC&rewriteBatchedStatements=true
spring.datasource.username=nivora_app
spring.datasource.password=${NIVORA_DB_CLAVE}

spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

nivora.empresa-agua.url-base=http://127.0.0.1:8081
nivora.empresa-agua.conexion-ms=3000
nivora.empresa-agua.lectura-ms=5000
nivora.empresa-agua.comprobar-al-iniciar=false
nivora.empresa-agua.codigo-prueba=13100390

nivora.suministros.comprobar-al-iniciar=false
nivora.suministros.operacion-prueba=consultar
nivora.suministros.codigo-prueba=13100390

nivora.lecturas.comprobar-al-iniciar=false
nivora.lecturas.codigo-prueba=13100390
nivora.lecturas.cursor-prueba=0
nivora.lecturas.limite-prueba=2

nivora.lecturas.almacenamiento.comprobar-al-iniciar=false
nivora.lecturas.almacenamiento.operacion-prueba=consultar

nivora.recuperacion.comprobar-al-iniciar=false
nivora.recuperacion.operacion-prueba=recuperar
nivora.recuperacion.maximo-paginas=2

nivora.sincronizacion.habilitada=true
nivora.sincronizacion.espera-inicial-ms=5000
nivora.sincronizacion.intervalo-ms=10000
nivora.sincronizacion.maximo-intentos-por-ciclo=2
nivora.sincronizacion.limite-pagina=100
nivora.sincronizacion.maximo-paginas-por-intento=2
nivora.sincronizacion.reserva-segundos=180
nivora.sincronizacion.intervalo-completo-segundos=300
nivora.sincronizacion.continuacion-segundos=10
nivora.sincronizacion.reintento-inicial-segundos=30
nivora.sincronizacion.reintento-maximo-segundos=1800
spring.task.scheduling.pool.size=1
spring.task.scheduling.thread-name-prefix=nivora-sync-

nivora.administradores.inicializar-al-iniciar=false
nivora.administradores.permitir-clave-corta-inicial=false

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
nivora.sesiones-administrativas.inactividad-segundos=900
nivora.sesiones-administrativas.duracion-maxima-segundos=28800
nivora.sesiones-administrativas.ventana-intentos-segundos=60
nivora.sesiones-administrativas.intentos-por-usuario=5
nivora.sesiones-administrativas.intentos-por-origen=30
nivora.administradores.confirmaciones-por-usuario=10
nivora.administradores.confirmaciones-por-origen=50

nivora.sesiones-consulta.duracion-segundos=1800
nivora.sesiones-consulta.ventana-intentos-segundos=60
nivora.sesiones-consulta.intentos-por-origen=30

nivora.tarifas.comprobar-al-iniciar=false
nivora.tarifas.codigo-prueba=13100390
