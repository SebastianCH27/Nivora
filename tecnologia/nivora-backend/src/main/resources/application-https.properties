# Perfil para un despliegue HTTPS; certificados y secretos externos al repositorio.
server.address=${NIVORA_HTTPS_DIRECCION:127.0.0.1}
server.port=${NIVORA_HTTPS_PUERTO:8443}
server.ssl.enabled=true
server.ssl.key-store=${NIVORA_TLS_KEYSTORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${NIVORA_TLS_CLAVE}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
nivora.empresa-agua.url-base=${NIVORA_EMPRESA_AGUA_URL_HTTPS:https://localhost:8444}
